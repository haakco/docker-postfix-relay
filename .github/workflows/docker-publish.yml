---
name: Publish ghcr.io/ghcr.io/haakco/postfix-relay Docker image
on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push Docker image ghcr.io/haakco/postfix-relay to Docker Hub
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      BUILDX_BUILDER_NAME: htz-containerd-buildkit
      BUILDX_CLUSTER_ENDPOINTS: tcp://buildkitd-0.buildkitd-headless.ga-ss-haakco.svc.cluster.local:1234,tcp://buildkitd-1.buildkitd-headless.ga-ss-haakco.svc.cluster.local:1234,tcp://buildkitd-2.buildkitd-headless.ga-ss-haakco.svc.cluster.local:1234
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/haakco/postfix-relay
          tags: |
            type=raw,value={{branch}}-{{sha}}
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=schedule,pattern={{date 'YYYYMMDD'}}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/haakco
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up remote Buildx
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a endpoints <<< "$BUILDX_CLUSTER_ENDPOINTS"
          docker buildx create --name "$BUILDX_BUILDER_NAME" --driver remote "${endpoints[0]}" --use
          for endpoint in "${endpoints[@]:1}"; do
            docker buildx create --name "$BUILDX_BUILDER_NAME" --append --driver remote "$endpoint"
          done
          docker buildx inspect --bootstrap
        with:
          driver-opts: |
            network=host
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ env.BUILDX_BUILDER_NAME }}
          context: .
          push: true
          build-args: |
            BASE_IMAGE_NAME=alpine
            BASE_IMAGE_TAG=latest
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/haakco/postfix-relay:buildcache
          cache-to: type=registry,ref=ghcr.io/haakco/postfix-relay:buildcache,mode=max
#          cache-from: type=gha
#          cache-to: type=gha,mode=max
